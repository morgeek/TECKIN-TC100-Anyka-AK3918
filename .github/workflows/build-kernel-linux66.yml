name: Build Linux 6.6 LTS Kernel with CMA 16MB for TECKIN TC100 (IPCAM2)

on:
  push:
    branches: [ v3-linux66 ]
    paths:
      - 'patches/kernel-6.6/**'
      - '.github/workflows/build-kernel-linux66.yml'
  workflow_dispatch:

jobs:
  build-kernel:
    name: Compile Linux 6.6 + Anyka AK3918 + CMA 16MB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev u-boot-tools gcc-arm-linux-gnueabi flex bison

      - name: Clone Linux 6.6.y Stable Tree
        run: |
          git clone --depth 1 -b linux-6.6.y https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux-src

      - name: Apply Anyka AK3918 Hardware & CMA Patches
        run: |
          cd linux-src
          echo "[+] Applying Step 1: Base Anyka SoC Support..."
          patch -p1 < ../patches/kernel-6.6/linux-6.6-ak3918-step1.patch
          echo "[+] Applying Step 2: System Control & Restart..."
          patch -p1 < ../patches/kernel-6.6/linux-6.6-ak3918-step2.patch
          echo "[+] Applying Step 3: Clock, Timer & Peripherals..."
          patch -p1 < ../patches/kernel-6.6/linux-6.6-ak3918-step3.patch
          echo "[+] Applying Step 4: Video Input V4L2 & JX-F23 MIPI..."
          patch -p1 < ../patches/kernel-6.6/linux-6.6-ak3918-step4.patch
          echo "[+] Applying Step 5: 16MB CMA Reservation in DTS..."
          patch -p1 < ../patches/kernel-6.6/linux-6.6-ak3918-step5-cma.patch

      - name: Configure Kernel with CMA
        run: |
          cd linux-src
          cp ../patches/kernel-6.6/defconfig_cma .config
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- olddefconfig
          echo "[+] Validating CMA Configuration in .config:"
          grep -E "CONFIG_CMA|CONFIG_DMA_CMA" .config

      - name: Compile zImage and Device Tree
        run: |
          cd linux-src
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- -j$(nproc) zImage anyka/ak3918ev300-tc100.dtb

      - name: Append DTB & Generate uImage (oipc.img)
        run: |
          cd linux-src
          cat arch/arm/boot/zImage arch/arm/boot/dts/anyka/ak3918ev300-tc100.dtb > arch/arm/boot/zImage-dtb
          mkimage -A arm -O linux -T kernel -C none -a 0x80008000 -e 0x80008000 -n "Linux 6.6 True V3 CMA16" -d arch/arm/boot/zImage-dtb oipc.img
          ls -lh oipc.img
          mkdir -p ../output
          cp oipc.img ../output/
          md5sum ../output/oipc.img > ../output/oipc.img.md5

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc100-linux66-cma16-kernel
          path: output/
