<header class="page-head"><h1 class="page-title">Diagnostics</h1></header>
<div id="diagnostics_container">
    <!-- One page for the camera's state, each part loaded when its tab is
         opened (each one runs several probes on the camera). -->
    <div class="tabs is-centered is-toggle is-small mb-4">
        <ul role="tablist">
            <li class="is-active" data-diag="diag_system" role="tab" tabindex="0" aria-selected="true"><a><span>System usage</span></a></li>
            <li data-diag="diag_stability" role="tab" tabindex="0" aria-selected="false"><a><span>Stability & Frigate</span></a></li>
            <li data-diag="diag_device" role="tab" tabindex="0" aria-selected="false"><a><span>Device</span></a></li>
            <li data-diag="diag_storage" role="tab" tabindex="0" aria-selected="false"><a><span>Storage</span></a></li>
            <li data-diag="diag_network" role="tab" tabindex="0" aria-selected="false"><a><span>Network</span></a></li>
        </ul>
    </div>
    <div class="buttons is-right mb-2">
        <button class="button is-small is-light" type="button" id="diag_refresh">Refresh</button>
    </div>
    <div class="diag-panel" id="diag_system" data-src="cgi-bin/sysusageinfo.cgi"></div>
    <div class="diag-panel" id="diag_stability" hidden>
        <div class="diagnostics-head">
            <div>
                <strong>Camera health & stability</strong>
                <small id="diagnostics_summary">Loading…</small>
            </div>
            <div class="buttons">
                <a class="button is-small is-light" href="cgi-bin/stability.cgi" download>Download CSV</a>
                <button class="button is-small" id="copy_frigate" type="button">Copy Frigate YAML</button>
            </div>
        </div>
        <div class="diagnostics-grid">
            <div>
                <h3>48-hour stability</h3>
                <canvas id="stability_chart" width="640" height="180" role="img" aria-label="Load and available memory history"></canvas>
                <small id="stability_legend">Waiting for samples</small>
            </div>
            <div>
                <h3>Frigate / go2rtc</h3>
                <pre id="frigate_preview">Loading configuration…</pre>
            </div>
        </div>
    </div>
    <div class="diag-panel" id="diag_device" data-src="cgi-bin/devinfo.cgi" hidden></div>
    <div class="diag-panel" id="diag_storage" data-src="cgi-bin/disk.cgi" hidden></div>
    <div class="diag-panel" id="diag_network" data-src="cgi-bin/network.cgi?part=diag" hidden></div>
</div>

<script>
    (function () {
        var root = document.getElementById('diagnostics_container');
        if (!root) return;
        if (!window.EliteUI || !window.EliteUI.loadInto) {
            root.innerHTML = '<article class="message is-danger"><div class="message-body">The page scripts did not load. Reload the page.</div></article>';
            return;
        }
        var current = 'diag_system';

        function drawStabilityChart(csv, memTotal) {
            var canvas = document.getElementById("stability_chart");
            var legend = document.getElementById("stability_legend");
            if (!canvas || !canvas.getContext) return;
            var rows = String(csv || "").trim().split(/\r?\n/).slice(1).map(function (line) {
                var c = line.split(",");
                return { load: parseFloat(c[2]) || 0, mem: parseInt(c[3], 10) || 0, bad: parseInt(c[4], 10) || 0 };
            });
            if (!rows.length) { if (legend) legend.textContent = "The first sample appears after five minutes."; return; }
            var ctx = canvas.getContext("2d"), w = canvas.width, h = canvas.height, pad = 18;
            ctx.clearRect(0, 0, w, h);
            function plot(color, value) {
                ctx.beginPath();
                rows.forEach(function (row, i) {
                    var x = pad + (rows.length === 1 ? 0 : i * (w - pad * 2) / (rows.length - 1));
                    var y = h - pad - Math.max(0, Math.min(1, value(row))) * (h - pad * 2);
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
            }
            plot("#3b9ef5", function (r) { return Math.min(r.load / 2, 1); });
            plot("#25a66a", function (r) { return memTotal > 0 ? r.mem / memTotal : 0; });
            rows.forEach(function (row, i) {
                if (!row.bad) return;
                var x = pad + (rows.length === 1 ? 0 : i * (w - pad * 2) / (rows.length - 1));
                ctx.fillStyle = "#d64545"; ctx.fillRect(x - 2, 4, 4, h - 8);
            });
            if (legend) legend.textContent = rows.length + " samples · blue: load · green: available memory · red: incident";
        }

        function loadStabilityData() {
            var summary = document.getElementById("diagnostics_summary");
            if (summary) summary.textContent = "Loading…";
            Promise.all([
                fetch("cgi-bin/health.cgi", {cache:"no-store"}).then(function(r){return r.json();}),
                fetch("cgi-bin/stability.cgi", {cache:"no-store"}).then(function(r){return r.text();}),
                fetch("cgi-bin/state.cgi?cmd=frigateyaml&redact=1", {cache:"no-store"}).then(function(r){return r.text();})
            ]).then(function(data) {
                var health = data[0] || {}, services = health.services || {}, bad = 0;
                Object.keys(services).forEach(function(k){ if (services[k] === "unhealthy" || services[k] === "error") bad++; });
                if (summary) summary.textContent = bad ? bad + " service issue(s)" : "Core services healthy";
                var preview = document.getElementById("frigate_preview");
                if (preview) preview.textContent = data[2];
                drawStabilityChart(data[1], health.system ? health.system.mem_total_kb : 0);
            }).catch(function() {
                if (summary) summary.textContent = "Diagnostics unavailable";
            });
        }

        var copy = document.getElementById("copy_frigate");
        if (copy) {
            copy.addEventListener("click", function () {
                var text = document.getElementById("frigate_preview") ? document.getElementById("frigate_preview").textContent : "";
                if (navigator.clipboard && text) {
                    navigator.clipboard.writeText(text).then(function(){
                        copy.textContent = "Copied";
                        setTimeout(function(){copy.textContent="Copy Frigate YAML";}, 1200);
                    });
                }
            });
        }

        function show(id, reload) {
            current = id;
            root.querySelectorAll('.tabs li').forEach(function (li) {
                li.classList.toggle('is-active', li.dataset.diag === id);
                li.setAttribute('aria-selected', li.dataset.diag === id ? 'true' : 'false');
            });
            root.querySelectorAll('.diag-panel').forEach(function (p) { p.hidden = p.id !== id; });
            var panel = document.getElementById(id);
            if (id === 'diag_stability') {
                if (reload || !panel.dataset.loaded) {
                    panel.dataset.loaded = '1';
                    loadStabilityData();
                }
                return;
            }
            if (panel && panel.dataset.src && (reload || !panel.dataset.loaded)) {
                panel.dataset.loaded = '1';
                panel.innerHTML = '<p class="help">Loading…</p>';
                window.EliteUI.loadInto(panel, panel.dataset.src);
            }
        }
        root.querySelectorAll('.tabs li').forEach(function (li) {
            li.addEventListener('click', function () { show(li.dataset.diag, false); });
            li.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(li.dataset.diag, false); }
            });
        });
        document.getElementById('diag_refresh').addEventListener('click', function () { show(current, true); });
        show(current, false);
    })();
</script>
