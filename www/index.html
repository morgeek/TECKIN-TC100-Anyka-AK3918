<!DOCTYPE html>
<html class="has-navbar-fixed-top">

<head>
    <meta charset=utf-8 />
    <title>Anyka</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS Framework -->
    <link href="css/bulma.0.6.2.min.css" rel="stylesheet">
    <link href="css/bulma-divider.min.css" rel="stylesheet">
    <link href="css/bulma-switch.1.0.1.min.css" rel="stylesheet">
    <link href="css/bulma-badge.1.0.1.min.css" rel="stylesheet">
    <link href="css/bulma-quickview.1.0.1.min.css" rel="stylesheet">
    <link href="css/ui-modern.css" rel="stylesheet">
    <link href="icomoon/style.css" rel="stylesheet">
    <!-- Prefer lightweight bundles; global jQuery removed to lower client CPU and memory -->

    <style id="custom_css">
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        #main {
            flex: 1 0 auto;
        }

        /*
        script_card <= scripts.cgi
        status_card <= status.cgi
        */

        .script_card,
        .status_card {
            max-width: 100%;
            margin-bottom: 1em;
        }

        @media screen and (min-width: 1024px) {
            .script_card,
            .status_card {
                /* reduce width for large screens */
                max-width: 75%
            }
        }
    </style>
</head>

<body>
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a id="navbar_burger" role="button" class="navbar-burger" data-target="nav_menu" aria-label="menu" aria-expanded="false">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
                <a class="navbar-item icnbtn" href="." id="title" title="Anyka"><i class="icon-eye"></i></a>
                <a class="navbar-item icnbtn onpage" href="javascript: void(0)" data-target="view_records.html" id="viewrecordspage" title="Records"><i class="icon-play-circle-o"></i></a>
                <!-- TODO: uncomment when implemented
                <a class="navbar-item icnbtn" id="btn-ptt" onpointerdown="pushToTalk('on')" title="Push To Talk"><span><i class="icon-microphone"></i></span></a>
                -->
            </div>
            <div class="navbar-menu" id="nav_menu">
                <!-- left menu -->
                <div class="navbar-start" id="common_nav">
                    <div class="navbar-item has-dropdown is-hoverable">
                        <span class="navbar-link">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-6M4 11V3M12 21v-9M12 7V3M20 21v-4M20 12V3M1 15h6M9 11h6M17 17h6"/></svg>
                                <span>Manage</span>
                            </span>
                        </span>
                        <div class="navbar-dropdown is-boxed">
                            <a id="status" class="navbar-item onpage" href="javascript: void(0)" data-target="cgi-bin/status.cgi">
                                <span class="nav-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 6h9M4.5 6h2M8.5 6a1 1 0 1 0-2 0a1 1 0 0 0 2 0zM19.5 12h-2M4.5 12h9M17.5 12a1 1 0 1 0 2 0a1 1 0 0 0-2 0zM10.5 18h9M4.5 18h2M8.5 18a1 1 0 1 0-2 0a1 1 0 0 0 2 0z"/></svg>
                                    <span>Settings</span>
                                </span>
                            </a>
                        </div>
                    </div>
                    <div class="navbar-item has-dropdown is-hoverable">
                        <span class="navbar-link">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v7M7.8 5.8a7 7 0 1 0 8.4 0"/></svg>
                                <span>System</span>
                            </span>
                        </span>
                        <div class="navbar-dropdown is-boxed">
                            <a class="navbar-item prompt" href="javascript: void(0)" data-message="Are you sure you wish to reboot?" data-target="cgi-bin/action.cgi?cmd=reboot">Reboot</a>
                            <a class="navbar-item prompt" href="javascript: void(0)" data-message="Are you sure you wish to shutdown?" data-target="cgi-bin/action.cgi?cmd=shutdown">Shutdown</a>
                        </div>
                    </div>
                    <div class="navbar-item has-dropdown is-hoverable">
                        <span class="navbar-link">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8h.01M11 12h1v4h1M12 22a10 10 0 1 1 0-20a10 10 0 0 1 0 20z"/></svg>
                                <span>Information</span>
                            </span>
                        </span>
                        <div class="navbar-dropdown is-boxed">
                            <a id="sysusageinfo" class="navbar-item onsettings" href="javascript: void(0)" data-target="cgi-bin/status.cgi" data-scroll="#embeddedSysUsageInfo">System Usage</a>
                            <a id="devinfo" class="navbar-item onsettings" href="javascript: void(0)" data-target="cgi-bin/status.cgi" data-scroll="#embeddedDeviceInfo">Device Info</a>
                            <a id="network" class="navbar-item onsettings" href="javascript: void(0)" data-target="cgi-bin/status.cgi" data-scroll="#embeddedNetworkInfo">Network & DNS</a>
                            <a id="disk" class="navbar-item onsettings" href="javascript: void(0)" data-target="cgi-bin/status.cgi" data-scroll="#embeddedDiskInfo">Disk & Mounts</a>
                            <a id="logs" class="navbar-item onsettings" href="javascript: void(0)" data-target="cgi-bin/status.cgi" data-scroll="#embeddedLogs">Logs</a>
                        </div>
                    </div>
                </div>
                <!-- right menu -->
                <div class="navbar-end">
                    <div id="camcontrol_link" class="navbar-item has-dropdown">
                        <!-- Camera Movement Controls -->
                        <span class="navbar-link">Camera Controls</span>
                        <div id="camcontrol_items" class="navbar-dropdown is-boxed is-right">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section id="main" class="section">
        <div id="content" class="container app-shell">
            <div class="sysusage-wrap">
                <em id="sysusage">...</em>
            </div>
            <div class="app-toolbar">
                <button class="button" id="live_toggle" type="button">Pause Live</button>
                <a class="button is-light" id="live_snapshot" href="cgi-bin/currentpic.cgi" target="_blank" rel="noopener">Snapshot</a>
            </div>
            <div class="liveview-wrap">
                <img id="liveview" src="cgi-bin/currentpic.cgi" loading="eager" decoding="async" onerror="this.src='css/unable_load.png';">
            </div>
        </div>
    </section>

    <div id="quickviewDefault" class="quickview">
        <header class="quickview-header">
            <p class="title">Quickview</p>
            <span id="quickViewClose" class="delete" data-dismiss="quickview"></span>
        </header>

        <div class="quickview-body">
            <div class="quickview-block" id="quicViewContent">
            </div>
        </div>

        <footer class="quickview-footer">

        </footer>
    </div>

    <!-- Prefer lightweight bundled scripts to reduce CPU and allow caching -->
    <script src="scripts/index.bundle.min.js" type="text/javascript" defer></script>

</body>

</html>
