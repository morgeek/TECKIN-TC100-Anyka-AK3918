name: Build base root filesystem (Buildroot, musl)

# Our own replacement for the OpenIPC root filesystem: Buildroot 2024.02 LTS,
# external tree v3/buildroot, BusyBox, dropbear, wpa_supplicant, curl, jq, alsa-utils.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  base-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cpio unzip rsync bc file wget libncurses-dev
          echo "CFLAGS_FOR_BUILD=-std=gnu17" >> $GITHUB_ENV
          echo "HOSTCFLAGS=-std=gnu17" >> $GITHUB_ENV

      - name: Fetch Buildroot 2024.02.9
        run: |
          git clone --depth 1 --branch 2024.02.9 https://github.com/buildroot/buildroot.git buildroot-src
          sed -i 's/M4_VERSION = 1.4.19/M4_VERSION = 1.4.21/' buildroot-src/package/m4/m4.mk
          sed -i 's/f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66/f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66/' buildroot-src/package/m4/m4.hash 2>/dev/null || true
          echo "sha256  f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66  m4-1.4.21.tar.xz" > buildroot-src/package/m4/m4.hash
          echo "sha256  3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986  COPYING" >> buildroot-src/package/m4/m4.hash

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: buildroot-dl-2024.02.9-${{ hashFiles('v3/buildroot/configs/**') }}
          restore-keys: buildroot-dl-2024.02.9-

      - name: Build
        run: |
          set -e
          mkdir -p dl
          make -C buildroot-src BR2_EXTERNAL=$PWD/v3/buildroot BR2_DL_DIR=$PWD/dl O=$PWD/br-out tc100_defconfig
          make -C buildroot-src BR2_EXTERNAL=$PWD/v3/buildroot BR2_DL_DIR=$PWD/dl O=$PWD/br-out -j$(nproc)
          ls -l br-out/images/

      - name: Size of the root filesystem
        run: |
          ls -l br-out/images/rootfs.cpio.gz
          mkdir t && cd t && gzip -dc ../br-out/images/rootfs.cpio.gz | sudo cpio -id --quiet && sudo du -sk . && sudo du -ak . | sort -rn | head -25

      - uses: actions/upload-artifact@v4
        with:
          name: tc100-base-rootfs
          path: br-out/images/rootfs.cpio.gz
