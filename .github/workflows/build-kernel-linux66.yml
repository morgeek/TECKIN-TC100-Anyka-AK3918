name: Build Linux 6.6 LTS Kernel with CMA 16MB for TECKIN TC100

on:
  push:
    branches: [ main, v3-linux66, v3-on-main ]
    # a tag v3... also publishes the GitHub release (path filters do not apply to tags)
    tags: [ 'v3*' ]
    paths:
      - 'patches/kernel-6.6/**'
      - 'v3/**'
      - 'www/**'
      - 'scripts/**'
      - 'controlscripts/**'
      - 'config/**'
      - 'sounds/**'
      - 'src/tc100rtsp/**'
      - 'src/libakuio/**'
      - 'src/httpfront/**'
      - 'src/mqttd/**'
      - 'src/supervisord/**'
      - 'src/onvifd/**'
      - 'src/mdnsd/**'
      - 'src/ispflip/**'
      - 'src/rwconf/**'
      - 'src/logfwd/**'
      - 'src/netacl/**'
      - 'src/whep/**'
      - 'bin/**'
      - 'lib/**'
      - 'src/jpegenc/**'
      - 'VERSION'
      - '.github/workflows/build-kernel-linux66.yml'
  workflow_dispatch:
    inputs:
      venc_pool:
        description: 'Test kernel only: compiled default of ak39_venc.pool (e.g. 12M for the encoder smart mode, item 9 of the implementer list). Empty = the normal 9600K.'
        required: false
        default: ''

jobs:
  base:
    name: Base root filesystem (Buildroot)
    uses: ./.github/workflows/build-base-rootfs.yml

  build-kernel:
    name: Compile Linux 6.6 + Anyka AK3918 + CMA 16MB
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # the publish step reads the CI run of the commit (audit D4)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev u-boot-tools gcc-arm-linux-gnueabi flex bison device-tree-compiler squashfs-tools zip

      - name: Clone Linux 6.6 Stable Tree (Tag v6.6)
        run: |
          git clone --depth 1 -b v6.6 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux-src

      - name: Apply Anyka AK3918 Hardware, CMA 16MB & ALSA Audio Patches
        run: |
          cd linux-src
          echo "[+] Applying the Anyka AK3918 patch series (per subsystem)..."
          git config user.email ci@example.invalid && git config user.name ci
          git am --whitespace=nowarn ../patches/kernel-6.6/series/*.patch
          # a test kernel with another encoder pool (manual run with venc_pool): the pool is a boot-time allocation and
          # the command line comes from the bootloader, which is never changed, so the default itself is compiled in
          VP="${{ github.event.inputs.venc_pool }}"
          if [ -n "$VP" ]; then
            case "$VP" in [0-9]*[KM]) ;; *) echo "venc_pool must look like 9600K or 12M"; exit 1 ;; esac
            n=${VP%[KM]}; case "$VP" in *M) n=$((n * 1024)) ;; esac
            [ "$n" -ge 4096 ] && [ "$n" -le 12288 ] || { echo "venc_pool must be between 4M and 12M (the area is 12 MiB)"; exit 1; }
            grep -q 'static char \*pool = "9600K";' drivers/misc/ak39_venc.c
            sed -i "s/static char \*pool = \"9600K\";/static char *pool = \"$VP\";/" drivers/misc/ak39_venc.c
            grep -n 'static char \*pool' drivers/misc/ak39_venc.c
            echo "### Test kernel: ak39_venc.pool default $VP (not for release)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Kernel with CMA and ALSA
        run: |
          cd linux-src
          # RTL8188FU firmware (embedded in the kernel): from linux-firmware, pinned tag and checksum (not stored here)
          mkdir -p firmware/rtlwifi
          curl -sfL --retry 3 "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtlwifi/rtl8188fufw.bin?h=20241017" -o firmware/rtlwifi/rtl8188fufw.bin
          echo "e6189d6d7032b83f0ed4284629c43db66262449a866f33fd329e611239f62e1f  firmware/rtlwifi/rtl8188fufw.bin" | sha256sum -c -
          cp ../patches/kernel-6.6/defconfig_cma .config
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- olddefconfig
          echo "[+] Validating CMA & Audio Configuration in .config:"
          grep -E "CONFIG_CMA|CONFIG_SOUND|CONFIG_SND_AK_PCM|CONFIG_CODEC_AK39|CONFIG_ZRAM|CONFIG_ZSMALLOC|CONFIG_BLK_DEV" .config

      - name: Compile zImage and Device Tree
        run: |
          set -eo pipefail
          cd linux-src
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- -j$(nproc) zImage dtbs 2>&1 | tee ../build.log

      - name: Show Build Errors on Failure
        if: failure()
        run: |
          tail -n 120 build.log || true

      - name: Append DTB & Generate uImage (oipc.img)
        run: |
          cd linux-src
          echo "[+] Locating compiled DTB files in arch/arm/boot/:"
          find arch/arm/boot/ -name "*.dtb" || true
          DTB_PATH=$(find arch/arm/boot/ -name "*tc100*.dtb" | head -n 1)
          if [ -z "$DTB_PATH" ] || [ ! -f "$DTB_PATH" ]; then
            echo "[!] Building DTB directly via dtc..."
            mkdir -p arch/arm/boot/dts/anyka
            dtc -I dts -O dtb -o arch/arm/boot/dts/anyka/ak3918ev300-tc100.dtb arch/arm/boot/dts/anyka/ak3918ev300-tc100.dts
            DTB_PATH="arch/arm/boot/dts/anyka/ak3918ev300-tc100.dtb"
          fi
          echo "[+] Selected DTB: $DTB_PATH"
          ls -lh "$DTB_PATH"
          cat arch/arm/boot/zImage "$DTB_PATH" > arch/arm/boot/zImage-dtb
          mkimage -A arm -O linux -T kernel -C none -a 0x80008000 -e 0x80008000 -n "Linux 6.6 True V3 CMA16+ALSA" -d arch/arm/boot/zImage-dtb oipc.img
          ls -lh oipc.img
          mkdir -p ../output
          cp oipc.img ../output/
          md5sum ../output/oipc.img > ../output/oipc.img.md5

      - name: Flash budget gate (kernel must fit the 2 MiB KERNEL region)
        run: |
          python3 scripts/flash_budget.py --kernel output/oipc.img
          # cameras installed by hand on 2026-10-24 load 0x1ce000 bytes of the kernel partition (U-Boot flashload)
          n=$(wc -c < output/oipc.img); [ "$n" -le 1892352 ] || echo "::warning::kernel is $n bytes: more than the 0x1ce000 that the first hand-made flashload reads" 

      - name: Get our base root filesystem
        uses: actions/download-artifact@v4
        with:
          name: tc100-base-rootfs
          path: base-rootfs

      - name: Build the test pack (initramfs, jpegenc, libakuio, self-test)
        run: |
          set -e
          P=output/tc100test
          mkdir -p $P
          cp output/oipc.img $P/
          test -f base-rootfs/rootfs.cpio.gz   # our Buildroot image; no fallback
          sudo sh v3/build-rootfs66.sh base-rootfs/rootfs.cpio.gz $P/oipcrd66.gz
          arm-linux-gnueabi-gcc -O2 -Wall -static src/jpegenc/jpegenc.c -o $P/jpegenc
          arm-linux-gnueabi-gcc -Os -Wall -marm -march=armv5te -nostdlib -static -fno-builtin -fno-pic -no-pie -Wl,--build-id=none -s src/httpfront/httpfront.c -o $P/httpfront
          arm-linux-gnueabi-gcc -Os -Wall -marm -march=armv5te -nostdlib -static -fno-builtin -fno-pic -no-pie -Wl,--build-id=none -s src/mdnsd/mdnsd.c -o $P/tc100-mdnsd
          make -C src/libakuio CROSS=arm-linux-gnueabi- >/dev/null
          cp src/libakuio/libakuio.so $P/
          make -C src/tc100rtsp CROSS=arm-linux-gnueabi- >/dev/null
          cp src/tc100rtsp/tc100_rtsp $P/
          make -C src/mqttd CROSS=arm-linux-gnueabi- >/dev/null
          cp src/mqttd/tc100-mqttd $P/
          make -C src/supervisord CROSS=arm-linux-gnueabi- >/dev/null
          cp src/supervisord/tc100-supervisord $P/
          make -C src/onvifd CROSS=arm-linux-gnueabi- >/dev/null
          cp src/onvifd/tc100-onvifd $P/
          # rc27 R3: a libc variable crashed tc100-onvifd on the camera; only the programs built so far (rwconf, logfwd and
          # netacl are built in the release step, which checks them all)
          sh tests/check-libc-data-imports.sh src/tc100rtsp src/mqttd src/onvifd src/supervisord
          # item 35, first step: the SRTP cost bench (test pack only, not in the release)
          arm-linux-gnueabi-gcc -O2 -Wall -Wextra -Werror -static -march=armv5te -mtune=arm926ej-s -s -o $P/srtp-bench src/whep/srtp_bench.c
          cp v3/selftest66.sh v3/S39tc100-linux66 v3/autorun-linux66.sh $P/
          cat > $P/README-TEST.txt <<EOF
          RAM-only test of the Linux 6.6 image (nothing is written to flash).
          1. Copy this folder (tc100test) to the SD card (FAT32), never to the card root.
             Also put wpa_supplicant.conf (your Wi-Fi) in it, and a config/user.pwd on the card root if you want remote login.
          2. Create the empty files tc100test/selftest (and tc100test/selftest-jpeg for the hardware JPEG test).
          3. From the stock U-Boot prompt, check the md5 of oipc.img on the card, then:
               fatload mmc 0 0x82000000 tc100test/oipc.img
               fatload mmc 0 0x81000000 tc100test/oipcrd66.gz
               setenv bootargs console=ttySAK0,115200n8 mem=64M cma=18M root=/dev/ram0 rdinit=/init initrd=0x81000000,$(wc -c < $P/oipcrd66.gz) panic=0 loglevel=7
               bootm 0x82000000
          4. About 40 s after boot the log tc100test/selftest-1.log is on the card.
          EOF
          (cd $P && md5sum * > md5sums.txt)

      - name: Build the 3.0 release (free user space image, SD package, web update)
        run: |
          set -e
          arm-linux-gnueabi-gcc -Os -Wall -static -march=armv5te -mfloat-abi=soft -o output/envtool v3/install/envtool.c
          # isp_flip ships from its source, not the copy kept in bin/ (audit D3); freestanding like httpfront
          arm-linux-gnueabi-gcc -Os -Wall -marm -march=armv5te -nostdlib -static -fno-builtin -fno-pic -no-pie -Wl,--build-id=none -s src/ispflip/isp_flip.c -o bin/isp_flip
          # rwconf (item 53) ships from its source too: free C code, uClibc stand-in libc like tc100-mqttd
          make -C src/rwconf CROSS=arm-linux-gnueabi- >/dev/null
          cp src/rwconf/rwconf bin/rwconf
          # tc100-logfwd and libnetacl.so (uClibc programs of the camera): built here with the stand-in libc technique, no Anyka toolchain
          make -C src/logfwd CROSS=arm-linux-gnueabi- >/dev/null
          cp src/logfwd/tc100-logfwd bin/tc100-logfwd
          make -C src/netacl CROSS=arm-linux-gnueabi- >/dev/null
          cp src/netacl/libnetacl.so lib/libnetacl.so
          sh tests/check-libc-data-imports.sh
          gcc -O2 -Wall -o /tmp/envtool-host v3/install/envtool.c
          READELF=arm-linux-gnueabi-readelf sh v3/build-stack.sh output/tc100test base-rootfs/rootfs.cpio.gz output/stack
          sh v3/build-release.sh output/stack output/oipc.img output/tc100test/oipcrd66.gz output/envtool output/release

      - name: Upload the 3.0 release
        uses: actions/upload-artifact@v4
        with:
          name: tc100-3-release${{ github.event.inputs.venc_pool && format('-TESTKERNEL-pool{0}', github.event.inputs.venc_pool) || '' }}
          path: |
            output/release/*.zip
            output/release/*.tar

      - name: Publish the GitHub release (tags v3*)
        if: startsWith(github.ref, 'refs/tags/v3')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # the tag must name the version the files carry (a v3.0.1 tag on a 3.0.1-rc24 tree would publish rc files
          # as the release)
          V=$(head -n 1 "$GITHUB_WORKSPACE/VERSION" | tr -d '\r')
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION $V"; exit 1; }
          # audit D4: only a commit whose CI (ci.yml, run by the push to main) passed is published; wait for it, up
          # to 30 minutes
          r=
          for i in $(seq 1 60); do
            r=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
                --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            case "$r" in "completed success") break ;; completed*) echo "CI of $GITHUB_SHA: $r"; exit 1 ;; esac
            sleep 30
          done
          [ "$r" = "completed success" ] || { echo "no passed CI run for $GITHUB_SHA (last seen: $r)"; exit 1; }
          cd output/release
          md5sum *.zip *.tar > MD5SUMS.txt
          PRE=; case "$GITHUB_REF_NAME" in *-rc*|*-beta*|*-alpha*) PRE=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $PRE             --title "TC100 firmware $GITHUB_REF_NAME" --notes-file "$GITHUB_WORKSPACE/v3/install/RELEASE-NOTES.md"             *.zip *.tar MD5SUMS.txt

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc100-linux66-cma16-kernel${{ github.event.inputs.venc_pool && format('-pool{0}', github.event.inputs.venc_pool) || '' }}
          path: output/

      - name: Pack kernel symbols (to decode Oops traces)
        run: |
          mkdir -p symbols
          cp linux-src/System.map linux-src/.config symbols/
          # unstripped user-space programs (the shipped ones are stripped)
          cp src/tc100rtsp/tc100_rtsp.dbg src/libakuio/libakuio.dbg.so src/mqttd/tc100-mqttd.dbg src/onvifd/tc100-onvifd.dbg src/supervisord/tc100-supervisord.dbg symbols/ 2>/dev/null || true
          gzip -c linux-src/vmlinux > symbols/vmlinux.gz

      - name: Upload kernel symbols
        uses: actions/upload-artifact@v4
        with:
          name: tc100-linux66-symbols
          path: symbols/
