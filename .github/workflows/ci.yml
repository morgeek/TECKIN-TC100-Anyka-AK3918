name: CI

on:
  push:
    branches: [main, overclock]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Shell syntax (busybox ash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install busybox
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - name: Parse every camera-side shell script with busybox ash
        run: |
          fail=0
          count=0
          for f in $(git ls-files); do
            head -n 1 "$f" 2>/dev/null | grep -qE '^#!.*(/sh|ash)' || continue
            count=$((count + 1))
            if ! out=$(busybox ash -n "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            fi
          done
          echo "Checked $count scripts"
          exit $fail

  host-tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freestanding ARM programs with this runner's compiler (no libgcc helper may be pulled in)
        run: |
          sudo apt-get install -y -qq gcc-arm-linux-gnueabi
          for f in src/httpfront/httpfront.c src/mdnsd/mdnsd.c src/ispflip/isp_flip.c src/ispfps/isp_fps.c; do
            arm-linux-gnueabi-gcc -Os -Wall -marm -march=armv5te -nostdlib -static -fno-builtin -fno-pic -no-pie \
              -Wl,--build-id=none -s "$f" -o /tmp/fs.bin || exit 1
          done
      - name: Busybox (the scripts run under busybox ash on the camera; the tests use it when present, else dash)
        run: sudo apt-get install -y -qq busybox-static
      - name: Python regressions
        run: |
          set -o pipefail
          # the failing tests also go to the run's annotations, which can be read without access to the logs
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/py.log || {
            grep -E '^(FAIL|ERROR): ' /tmp/py.log | sort -u | while read -r l; do echo "::error title=unittest::$l"; done
            awk '/^(FAIL|ERROR): /{n=12} n>0{print; n--}' /tmp/py.log | grep -E 'Error|assert|line [0-9]+' | head -20 |
              while read -r l; do echo "::error title=detail::$l"; done
            exit 1; }
      # 2026-11-07: tc100-mqttd, -onvifd, -supervisord, -logfwd, rwconf and libnetacl-musl are musl programs (the camera's
      # libc): build musl 1.2.4 and run the ARM builds under qemu with the real musl loader. A step of its own, after the
      # regressions above (which run without qemu-arm, as before).
      - name: Cached musl sysroot
        uses: actions/cache@v4
        with:
          path: build/musl
          key: musl-1.2.4-${{ hashFiles('v3/musl/build-musl.sh') }}
      - name: musl programs under qemu-arm
        run: |
          sudo apt-get install -y -qq qemu-user
          sh v3/musl/build-musl.sh
          python3 -m unittest -v tests.test_musl_programs_qemu tests.test_uclibc_standin_qemu 2>&1 | tee /tmp/musl.log
          grep -q '^OK' /tmp/musl.log && ! grep -q 'skipped' /tmp/musl.log
      - name: Frontend tests
        run: node --test tests/frontend.test.js tests/settings-save.test.js tests/live-video.test.js tests/whep-live.test.js tests/records-timeline.test.js

  whep-interop:
    name: WebRTC gateway against aiortc (item 35)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # builds mbedTLS 2.28.9 with DTLS-SRTP (as the base image does), tc100-whep against it, then runs
      # tests/whep_interop.py: a fake RTSP source, the daemon and aiortc as the browser (see the script)
      - name: tc100-whep with a real WebRTC client
        run: sh tests/docker/whep-interop.sh
      # the camera's C library is musl: compile there too (the base image build is the only other place, 40 min)
      - name: tc100-whep compiled with musl
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.20 sh /src/tests/docker/whep-musl.sh
