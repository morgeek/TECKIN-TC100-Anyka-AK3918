name: Build base root filesystem (Buildroot, musl)

# Our own replacement for the OpenIPC root filesystem: Buildroot 2024.02 LTS,
# external tree v3/buildroot, BusyBox, dropbear, wpa_supplicant, curl, jq, alsa-utils.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  base-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The finished image, keyed on everything that makes it (the external tree: configs, busybox fragment,
      # post-build script, package tweaks; and this workflow: Buildroot version and the fixes applied to it).
      # A hit skips the whole Buildroot build (about 40 minutes); any change there builds it again.
      - name: Cached base image
        id: base
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            br-out/images/rootfs.cpio.gz
            br-out/show-info.json
          key: base-rootfs-${{ hashFiles('v3/buildroot/**', 'src/whep/**', '.github/workflows/build-base-rootfs.yml', '.github/ci-pins.sh') }}

      - name: Build dependencies
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cpio unzip rsync bc file wget libncurses-dev
          echo "CFLAGS_FOR_BUILD=-std=gnu17" >> $GITHUB_ENV
          echo "HOSTCFLAGS=-std=gnu17" >> $GITHUB_ENV

      - name: Fetch Buildroot 2024.02.9
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          # pinned: the tag must be this commit (.github/ci-pins.sh); Buildroot checks each package download against its .hash
          . .github/ci-pins.sh
          git_clone_pinned "$BUILDROOT_TAG" "$BUILDROOT_COMMIT" buildroot-src https://github.com/buildroot/buildroot.git
          sed -i 's/M4_VERSION = 1.4.19/M4_VERSION = 1.4.21/' buildroot-src/package/m4/m4.mk
          sed -i 's/f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66/f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66/' buildroot-src/package/m4/m4.hash 2>/dev/null || true
          echo "sha256  f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66  m4-1.4.21.tar.xz" > buildroot-src/package/m4/m4.hash
          echo "sha256  3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986  COPYING" >> buildroot-src/package/m4/m4.hash
          sed -i '/\$(eval \$(cmake-package))/i MBEDTLS_CONF_OPTS += -DCMAKE_POLICY_VERSION_MINIMUM=3.5' buildroot-src/package/mbedtls/mbedtls.mk
          sed -i 's/-DCMAKE_COLOR_MAKEFILE=OFF/-DCMAKE_COLOR_MAKEFILE=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5/' buildroot-src/package/pkg-cmake.mk

      - name: Cache downloads
        if: steps.base.outputs.cache-hit != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: dl
          key: buildroot-dl-2024.02.9-${{ hashFiles('v3/buildroot/configs/**') }}
          restore-keys: buildroot-dl-2024.02.9-

      - name: Build
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          set -e
          # base image file times (BR2_REPRODUCIBLE is left off for now, review of CI-PIN): the time of the pinned Buildroot commit, not
          # ours, so the image keeps the same bytes while its cache key does (the key is the external tree, not the commit)
          export SOURCE_DATE_EPOCH=$(git -C buildroot-src log -1 --format=%ct)
          mkdir -p dl
          make -C buildroot-src BR2_EXTERNAL=$PWD/v3/buildroot BR2_DL_DIR=$PWD/dl O=$PWD/br-out tc100_defconfig
          make -C buildroot-src BR2_EXTERNAL=$PWD/v3/buildroot BR2_DL_DIR=$PWD/dl O=$PWD/br-out -j$(nproc)
          ls -l br-out/images/
          # item 35: the WebRTC gateway is a Buildroot package (v3/buildroot/package/tc100-whep): it must be in the image
          ls -l br-out/target/usr/bin/tc100-whep
          # [up-sbom] the package list of this build (name, version, licence, sources): the SBOM of the release is made from it
          make -s --no-print-directory -C buildroot-src BR2_EXTERNAL=$PWD/v3/buildroot BR2_DL_DIR=$PWD/dl O=$PWD/br-out show-info > br-out/show-info.json
          test -s br-out/show-info.json

      - name: Size of the root filesystem
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          ls -l br-out/images/rootfs.cpio.gz
          mkdir t && cd t && gzip -dc ../br-out/images/rootfs.cpio.gz | sudo cpio -id --quiet && sudo du -sk . && sudo du -ak . | sort -rn | head -25

      # one folder, so the artifact keeps the flat names the kernel job reads (base-rootfs/rootfs.cpio.gz)
      - name: Stage the artifact (image and package list)
        run: |
          mkdir base-out
          cp br-out/images/rootfs.cpio.gz base-out/
          # a cache entry from before [up-sbom] has no package list: the SBOM then says so, the build goes on
          cp br-out/show-info.json base-out/ || echo "::warning::no show-info.json in the cached base image"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tc100-base-rootfs
          path: base-out/*
