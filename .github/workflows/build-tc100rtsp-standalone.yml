name: Build tc100_rtsp standalone test binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabi make
      - name: Compile
        run: |
          make -C src/tc100rtsp clean
          make -C src/tc100rtsp CROSS=arm-linux-gnueabi-
          ls -lh src/tc100rtsp/tc100_rtsp
      - uses: actions/upload-artifact@v4
        with:
          name: tc100_rtsp-test
          path: src/tc100rtsp/tc100_rtsp
