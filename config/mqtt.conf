############################################################
# MQTT Configuration for Home Assistant Integration
############################################################

# 0 = disabled, 1 = enabled
MQTT_ENABLE=1

# Broker connection
# REPLACE THESE VALUES WITH YOUR BROKER DETAILS
MQTT_HOST=192.168.1.50
MQTT_PORT=1883
MQTT_USER=
MQTT_PASSWORD=

# Client settings
MQTT_CLIENT_ID=teckin-tc100
MQTT_TOPIC_ROOT=teckin/tc100
MQTT_TOPIC_COMMAND=teckin/tc100/command
MQTT_QOS=1

# Home Assistant Discovery
MQTT_HA_DISCOVERY_ENABLE=1
MQTT_HA_DISCOVERY_PREFIX=homeassistant

# Power Telemetry (Optional)
POWER_ESTIMATE_ENABLE=1
POWER_ESTIMATE_BASE_MW=1700
