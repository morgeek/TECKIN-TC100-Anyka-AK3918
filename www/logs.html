<div class="info-grid">
  <div class="info-side">
    <div class="card status_card info-card">
      <header class="card-header">
        <p class="card-header-title">
          <span class="title-with-icon">
            <svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l3 3v13H7zM14 4v3h3M10 11h7M10 15h7"/></svg>
            <span>Log Controls</span>
          </span>
        </p>
      </header>
      <div class="card-content">
        <div class="logs-tab-buttons" id="logsTabs">
          <button class="button is-small is-active" data-tab="1" type="button">Summary</button>
          <button class="button is-small" data-tab="2" type="button">dmesg</button>
          <button class="button is-small" data-tab="3" type="button">video server</button>
        </div>
        <button class="button is-small is-light" id="logsRefreshBtn" type="button">Refresh</button>
        <p class="help">Click to view the selected log. Double-click a tab to clear that log.</p>
      </div>
    </div>
  </div>

  <div class="info-main">
    <div class="card status_card info-card">
      <header class="card-header">
        <p class="card-header-title">
          <span class="title-with-icon">
            <svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg>
            <span id="logsTitle">Summary</span>
          </span>
        </p>
      </header>
      <div class="card-content">
        <div id="logsOutput" class="logs-output-box">Loading logs...</div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
(function () {
  var tabsContainer = document.getElementById("logsTabs");
  var output = document.getElementById("logsOutput");
  var title = document.getElementById("logsTitle");
  var refreshBtn = document.getElementById("logsRefreshBtn");
  if (!tabsContainer || !output || !title) {
    return;
  }

  var tabNames = {
    "1": "Summary",
    "2": "dmesg",
    "3": "video server",
  };
  var currentTab = "1";

  function setActiveTabButton(tab) {
    Array.prototype.slice.call(tabsContainer.querySelectorAll("button[data-tab]")).forEach(function (btn) {
      btn.classList.toggle("is-active", btn.getAttribute("data-tab") === tab);
    });
  }

  function setLoadingState() {
    output.textContent = "Loading logs...";
  }

  function loadLog(tab, clearMode) {
    currentTab = String(tab || "1");
    setActiveTabButton(currentTab);
    title.textContent = tabNames[currentTab] || "Logs";
    setLoadingState();

    var cmd = clearMode ? "clearlog" : "showlog";
    var body = "logname=" + encodeURIComponent(currentTab);

    fetch("cgi-bin/action.cgi?cmd=" + cmd, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body,
      cache: "no-store",
    })
      .then(function (r) {
        return r.text();
      })
      .then(function (html) {
        output.innerHTML = html;
      })
      .catch(function (err) {
        console.error(err);
        output.innerHTML =
          "<article class='message is-danger'><div class='message-header'><p>Log error</p></div><div class='message-body'>Unable to load log output.</div></article>";
      });
  }

  tabsContainer.addEventListener("click", function (event) {
    var btn = event.target.closest("button[data-tab]");
    if (!btn) {
      return;
    }
    loadLog(btn.getAttribute("data-tab"), false);
  });

  tabsContainer.addEventListener("dblclick", function (event) {
    var btn = event.target.closest("button[data-tab]");
    if (!btn) {
      return;
    }
    loadLog(btn.getAttribute("data-tab"), true);
  });

  if (refreshBtn) {
    refreshBtn.addEventListener("click", function () {
      loadLog(currentTab, false);
    });
  }

  loadLog(currentTab, false);
})();
</script>
