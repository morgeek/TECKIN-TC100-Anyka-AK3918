    <!-- First-boot wizard redirect: synchronous LAN check (~1 ms), transparent on normal boots -->
    <script>
    (function() {
        var x = new XMLHttpRequest();
        try {
            x.open('GET', '/cgi-bin/wizard.cgi?check', false);
            x.send();
            var d = JSON.parse(x.responseText);
            if (d && d.first_boot) { window.location.replace('/cgi-bin/wizard.cgi'); }
        } catch (e) {}
    })();
    </script>

    <script>
        (function() {
            var html = document.documentElement;
            var toggle = document.getElementById('theme_toggle');
            var icon = document.getElementById('theme_toggle_icon');
            var themes = {
                light: { attr: 'light', path: 'M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM2 13h2M20 13h2M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41' },
                dark: { attr: 'dark', path: 'M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.303 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z' }
            };

            function setTheme(mode) {
                html.setAttribute('data-theme', mode);
                localStorage.setItem('elite_theme', mode);
                if (icon) {
                    var svg = icon.querySelector('svg');
                    var path = svg.querySelector('path');
                    path.setAttribute('d', themes[mode === 'dark' ? 'dark' : 'light'].path);
                    icon.title = mode === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode';
                }
            }

            var saved = localStorage.getItem('elite_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            setTheme(saved);

            if (toggle) {
                toggle.addEventListener('click', function() {
                    setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
                });
            }

            // Update Notifier Logic
            function checkUpdates() {
                var badge = document.getElementById('update_notifier');
                if (!badge) return;
                
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'cgi-bin/state.cgi?cmd=statusline', true);
                xhr.onload = function() {
                    if (xhr.status < 200 || xhr.status >= 300) return;
                    var data;
                    try { data = JSON.parse(xhr.responseText); } catch (parseErr) { return; }
                    if (data.update_available) {
                        badge.classList.add('is-active');
                        badge.title = "New Version Available: " + data.update_latest_version + " (Current: " + data.current_version + ")";
                        badge.onclick = function(e) {
                            e.preventDefault();
                            alert("A newer version of the Elite firmware is available!\n\nLatest: " + data.update_latest_version + "\nYour Version: " + (data.current_version || "v1.1.0-ELITE") + "\n\nPlease visit the GitHub repository to download the update.");
                        };
                    }
                };
                xhr.onerror = function() { console.warn("Update check failed"); };
                xhr.send();
            }

            // Run check once on load, then every 6 hours (if the tab stays open)
            setTimeout(checkUpdates, 2000);
            setInterval(checkUpdates, 1000 * 60 * 60 * 6);
        })();
    </script>
