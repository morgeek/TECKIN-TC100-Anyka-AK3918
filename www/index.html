<!DOCTYPE html>
<html class="has-navbar-fixed-top">

<head>
    <meta charset=utf-8 />
    <title>Anyka</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS Framework -->
    <link href="css/bulma.0.6.2.min.css" rel="stylesheet">
    <link href="css/ui-modern.min.css" rel="stylesheet">
    <link href="icomoon/style.css" rel="stylesheet">
    <!-- Prefer lightweight bundles; global jQuery removed to lower client CPU and memory -->

    <style id="custom_css">
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        #main {
            flex: 1 0 auto;
        }
    </style>
</head>

<body>
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a id="navbar_burger" role="button" class="navbar-burger" data-target="nav_menu" aria-label="menu"
                    aria-expanded="false">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
                <a class="navbar-item icnbtn" href="." id="title" title="Anyka"><i class="icon-eye"></i></a>
                <a class="navbar-item icnbtn onpage" href="javascript: void(0)" data-target="view_records.html"
                    id="viewrecordspage" title="Records"><i class="icon-play-circle-o"></i></a>
                <span class="navbar-item nav-sysusage-wrap"
                    title="Current CPU and RAM usage">
                    <em id="cpuusage" class="usage-chip usage-low">CPU: ...</em>
                    <em id="ramusage" class="usage-chip usage-low">RAM: ...</em>
                </span>
                <span class="navbar-item nav-perfprofile-wrap" title="Current performance profile">
                    <em id="perfprofile">Profile: ...</em>
                </span>
                <span class="navbar-item nav-nightmode-wrap" title="Auto-night mode luminance indicator">
                    <em id="nightmodebadge" class="nightmode-badge nightmode-unknown">&#127769; Night: ...</em>
                </span>
                <span class="navbar-item nav-mqtt-wrap" title="MQTT last publish status" style="display:none">
                    <em id="mqttbadge" class="mqtt-badge mqtt-unknown">MQTT</em>
                </span>
            </div>
            <div class="navbar-menu" id="nav_menu">
                <!-- left menu -->
                <div class="navbar-start" id="common_nav">
                    <a id="status" class="navbar-item onpage" href="javascript: void(0)"
                        data-target="cgi-bin/status.cgi" data-force-reload="1">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M10.5 6h9M4.5 6h2M8.5 6a1 1 0 1 0-2 0a1 1 0 0 0 2 0zM19.5 12h-2M4.5 12h9M17.5 12a1 1 0 1 0 2 0a1 1 0 0 0-2 0zM10.5 18h9M4.5 18h2M8.5 18a1 1 0 1 0-2 0a1 1 0 0 0 2 0z" />
                            </svg>
                            <span>Settings</span>
                        </span>
                    </a>
                    <a id="services" class="navbar-item onpage" href="javascript: void(0)"
                        data-target="cgi-bin/scripts.cgi">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M10.3 4.3l.6 1.7a6.4 6.4 0 0 1 2.2 0l.6-1.7l2 1.1l-.4 1.7c.6.4 1.1 1 1.6 1.6l1.7-.4l1.1 2l-1.7.6a6.4 6.4 0 0 1 0 2.2l1.7.6l-1.1 2l-1.7-.4c-.4.6-1 1.1-1.6 1.6l.4 1.7l-2 1.1l-.6-1.7a6.4 6.4 0 0 1-2.2 0l-.6 1.7l-2-1.1l.4-1.7a6.4 6.4 0 0 1-1.6-1.6l-1.7.4l-1.1-2l1.7-.6a6.4 6.4 0 0 1 0-2.2l-1.7-.6l1.1-2l1.7.4c.4-.6 1-1.1 1.6-1.6l-.4-1.7l2-1.1zM12 9a3 3 0 1 0 0 6a3 3 0 0 0 0-6z" />
                            </svg>
                            <span>Services</span>
                        </span>
                    </a>
                    <div class="navbar-item has-dropdown is-hoverable">
                        <a class="navbar-link" href="javascript: void(0)">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 8h.01M11 12h1v4h1M12 22a10 10 0 1 1 0-20a10 10 0 0 1 0 20z" />
                                </svg>
                                <span>Information</span>
                            </span>
                        </a>
                        <div class="navbar-dropdown is-boxed">
                            <a id="sysusageinfo" class="navbar-item onpage" href="javascript: void(0)"
                                data-target="cgi-bin/sysusageinfo.cgi">
                                <span class="info-menu-item">
                                    <svg class="info-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M4 18h16M7 14l3-3l3 2l4-5" />
                                    </svg>
                                    <span>System Usage</span>
                                </span>
                            </a>
                            <a id="devinfo" class="navbar-item onpage" href="javascript: void(0)"
                                data-target="cgi-bin/devinfo.cgi">
                                <span class="info-menu-item">
                                    <svg class="info-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path
                                            d="M8 4h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM10 17h4" />
                                    </svg>
                                    <span>Device Info</span>
                                </span>
                            </a>
                            <a id="network" class="navbar-item onpage" href="javascript: void(0)"
                                data-target="cgi-bin/network.cgi">
                                <span class="info-menu-item">
                                    <svg class="info-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M12 3v6M5 21h14M6 9h12M7 15h10" />
                                    </svg>
                                    <span>Network & DNS</span>
                                </span>
                            </a>
                            <a id="disk" class="navbar-item onpage" href="javascript: void(0)"
                                data-target="cgi-bin/disk.cgi">
                                <span class="info-menu-item">
                                    <svg class="info-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path
                                            d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3s-3.6 3-8 3s-8-1.3-8-3zM4 12c0 1.7 3.6 3 8 3s8-1.3 8-3M4 17c0 1.7 3.6 3 8 3s8-1.3 8-3" />
                                    </svg>
                                    <span>Disk & Mounts</span>
                                </span>
                            </a>
                            <a id="logs" class="navbar-item onpage" href="javascript: void(0)" data-target="logs.html">
                                <span class="info-menu-item">
                                    <svg class="info-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M7 4h10l3 3v13H7zM14 4v3h3M10 11h7M10 15h7" />
                                    </svg>
                                    <span>Logs</span>
                                </span>
                            </a>
                        </div>
                    </div>
                    <div class="navbar-item has-dropdown is-hoverable">
                        <a class="navbar-link" href="javascript: void(0)" title="System" aria-label="System">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 3v7M7.8 5.8a7 7 0 1 0 8.4 0" />
                                </svg>
                            </span>
                        </a>
                        <div class="navbar-dropdown is-boxed">
                            <a class="navbar-item prompt" href="javascript: void(0)"
                                data-message="Are you sure you wish to reboot?"
                                data-target="cgi-bin/action.cgi?cmd=reboot">Reboot</a>
                            <a class="navbar-item prompt" href="javascript: void(0)"
                                data-message="Are you sure you wish to shutdown?"
                                data-target="cgi-bin/action.cgi?cmd=shutdown">Shutdown</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section id="main" class="section">
        <div id="content" class="container app-shell">
            <div class="app-toolbar">
                <button class="button" id="live_toggle" type="button">Resume Live</button>
                <a class="button is-light" id="live_snapshot" href="cgi-bin/currentpic.cgi" target="_blank"
                    rel="noopener">Snapshot</a>
                <button class="button is-danger" id="ptt_btn" type="button" title="Hold to talk to the camera speaker">
                    <i class="icon-microphone"></i> Hold to Talk
                </button>
                <span class="ptt-vol-wrap" title="Speaker volume for Push-to-Talk">
                    <i class="icon-volume-medium" style="vertical-align:middle;margin-right:2px;"></i>
                    <input type="range" id="ptt_vol" min="0" max="100" value="90"
                        style="width:80px;vertical-align:middle;" aria-label="PTT volume">
                    <span id="ptt_vol_label" style="font-size:0.8em;vertical-align:middle;min-width:2.5em;display:inline-block;">90%</span>
                </span>
            </div>
            <div class="liveview-wrap">
                <img id="liveview" src="cgi-bin/currentpic.cgi" loading="eager" decoding="async"
                    onerror="this.src='css/unable_load.png';">
            </div>
        </div>
    </section>

    <!-- Prefer lightweight bundled scripts to reduce CPU and allow caching -->
    <script src="scripts/index.bundle.min.js" type="text/javascript" defer></script>

</body>

</html>
