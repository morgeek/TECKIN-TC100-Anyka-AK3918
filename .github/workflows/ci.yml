name: CI

on:
  push:
    branches: [main, upgrade-3.2, upgrade-3.2.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-syntax:
    timeout-minutes: 10
    name: Shell syntax (busybox ash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install busybox
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 busybox-static
      - name: Parse every camera-side shell script with busybox ash
        run: |
          fail=0
          count=0
          # shebang scripts, and the sourced ones (scripts/action.d/*.sh, no shebang) that declare `# shellcheck shell=sh`
          for f in $(git ls-files); do
            head -n 1 "$f" 2>/dev/null | grep -qE '^#!.*(/sh|ash)' || head -n 3 "$f" 2>/dev/null | grep -q '^# shellcheck shell=sh' || continue
            count=$((count + 1))
            if ! out=$(busybox ash -n "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            fi
          done
          echo "Checked $count scripts"
          exit $fail

  host-tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    # a hung test (2026-11-27: an orphan daemon holding the pipe of "unittest | tee") fails the job instead of 6 h
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Freestanding ARM programs with this runner's compiler (no libgcc helper may be pulled in)
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y -qq -o Acquire::Retries=3 gcc-arm-linux-gnueabi
          for f in src/httpfront/httpfront.c src/mdnsd/mdnsd.c src/ispflip/isp_flip.c; do
            arm-linux-gnueabi-gcc -Os -Wall -marm -march=armv5te -nostdlib -static -fno-builtin -fno-pic -no-pie \
              -Wl,--build-id=none -s "$f" -o /tmp/fs.bin || exit 1
          done
      - name: Busybox (the scripts run under busybox ash on the camera; the tests use it when present, else dash)
        run: sudo apt-get install -y -qq -o Acquire::Retries=3 busybox-static
      - name: Python regressions
        run: |
          set -o pipefail
          # the failing tests also go to the run's annotations, which can be read without access to the logs
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/py.log || {
            grep -E '^(FAIL|ERROR): ' /tmp/py.log | sort -u | while read -r l; do echo "::error title=unittest::$l"; done
            awk '/^(FAIL|ERROR): /{n=12} n>0{print; n--}' /tmp/py.log | grep -E 'Error|assert|line [0-9]+' | head -20 |
              while read -r l; do echo "::error title=detail::$l"; done
            exit 1; }
          # as local-ci.sh: no "Ran N tests" line (python3 missing, an import error) is not a pass
          grep -q "^Ran [1-9]" /tmp/py.log || { echo "python tests did not run"; tail -20 /tmp/py.log; exit 1; }
      # [audit 3.2] the privilege-drop tests that need root (ONVIF password after the drop, files already right, rwconf as
      # another user) skip above as the runner user: run the module again as root, as tests/docker/local-ci.sh does
      - name: Privilege drop as root
        run: |
          sudo env "PATH=$PATH" python3 -m unittest tests.test_privdrop 2>&1 | tee /tmp/privroot.log
          grep -qE "^OK" /tmp/privroot.log || { grep -E '^(FAIL|ERROR): ' /tmp/privroot.log | while read -r l; do echo "::error title=privdrop-root::$l"; done; exit 1; }
      # 2026-11-07: tc100-mqttd, -onvifd, -supervisord, -logfwd, rwconf and libnetacl-musl are musl programs (the camera's
      # libc): build musl 1.2.6 and run the ARM builds under qemu with the real musl loader. A step of its own, after the
      # regressions above (which run without qemu-arm, as before).
      - name: Cached musl sysroot
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/musl
          key: musl-1.2.6-${{ hashFiles('v3/musl/build-musl.sh') }}
      - name: musl programs under qemu-arm
        run: |
          sudo apt-get install -y -qq -o Acquire::Retries=3 qemu-user
          sh v3/musl/build-musl.sh
          python3 -m unittest -v tests.test_musl_programs_qemu tests.test_uclibc_standin_qemu 2>&1 | tee /tmp/musl.log
          grep -q '^OK' /tmp/musl.log && ! grep -q 'skipped' /tmp/musl.log
      # audit 2026-11-24 T1: the native routes of httpfront (status line, dash, daynight, hw_state, health, isp_tune)
      # against their CGIs under busybox ash, as local-ci.sh cross. They skip without qemu-arm (the "Python regressions"
      # step above runs before it is installed): here a skip fails the step.
      - name: httpfront under qemu-arm
        run: |
          python3 -m unittest -v tests.test_httpfront_qemu tests.test_httpfront_native tests.test_httpfront_dash tests.test_httpfront_poll 2>&1 | tee /tmp/hf.log
          grep -q '^OK' /tmp/hf.log && ! grep -q 'skipped' /tmp/hf.log
      - name: Frontend tests
        run: node --test tests/frontend.test.js tests/settings-save.test.js tests/live-video.test.js tests/whep-live.test.js tests/records-timeline.test.js

  whep-interop:
    timeout-minutes: 30
    name: WebRTC gateway against aiortc (item 35)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      # builds Mbed TLS 3.6.7 with DTLS-SRTP (as the base image does), tc100-whep against it, then runs
      # tests/whep_interop.py: a fake RTSP source, the daemon and aiortc as the browser (see the script)
      - name: tc100-whep with a real WebRTC client
        run: sh tests/docker/whep-interop.sh
      # the camera's C library is musl: compile there too (the base image build is the only other place, 40 min)
      - name: tc100-whep compiled with musl
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.20 sh /src/tests/docker/whep-musl.sh

  # [up-fuzz] (audit 2026-11-27 SEC-5): libFuzzer on the parsers that read the network (RTSP, HTTP front, ONVIF, MQTT, STUN /
  # SDP / DTLS ClientHello of the WebRTC gateway, mDNS). Host only (x86, clang with AddressSanitizer and UBSan), never in the
  # camera image. 13 targets, 60 s each, 4 at a time. A crash, a hang or a leak fails the job and its input is uploaded.
  # Details: docs/linux-port/upgrade-3.2/fuzz.md; locally: sh tests/docker/local-ci.sh fuzz
  fuzz:
    name: Fuzz the network parsers (libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install clang (libFuzzer, AddressSanitizer)
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -qq -o Acquire::Retries=3 clang
      - name: Build every harness and run it for 60 s
        run: sh tests/fuzz/run.sh -t 60 -j 4 -o fuzz-out
      - name: Crash inputs and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fuzz-findings
          path: |
            fuzz-out/*/crash-*
            fuzz-out/*/timeout-*
            fuzz-out/*/oom-*
            fuzz-out/*/leak-*
            fuzz-out/*/log
          if-no-files-found: ignore
          retention-days: 14
