<!-- Use http://odyniec.net/projects/imgareaselect/ -->
<style id="logs_custom_css">
    #tab-content p {
  display: none;
}

#tab-content p.is-active {
  display: block;
}
#back-to-top {
    position: fixed;
    bottom: 40px;
    right: 40px;
    z-index: 9999;
    width: 32px;
    height: 32px;
    text-align: center;
    line-height: 30px;
    background: #f5f5f5;
    color: #444;
    cursor: pointer;
    border: 0;
    border-radius: 2px;
    text-decoration: none;
    transition: opacity 0.2s ease-out;
    opacity: 0;
}
#back-to-top:hover {
    background: #e9ebec;
}
#back-to-top.show {
    opacity: 1;
}

</style>


<h1 class="is-size-4">logs</h1>
<div class="tabs is-toggle is-fullwidth" id="tabs">
    <ul>
        <li class="is-active" data-tab="1">
            <a>
                <span class="icon is-small"><i class="fa fa-image"></i></span>
                <span>Summary</span>
            </a>
        </li>
        <li data-tab="2">
            <a>
                <span class="icon is-small"><i class="fa fa-music"></i></span>
                <span>dmesg</span>
            </a>
        </li>
        <li data-tab="3">
            <a>
                <span class="icon is-small"><i class="fa fa-file-text-o"></i></span>
                <span>video server</span>
            </a>
        </li>
    </ul>
</div>

<div id="tab-content">
    <p class="is-active" data-content="1" id="tab1">

    </p>
    <p data-content="2" id="tab2">

    </p>
    <p data-content="3" id="tab3">
        
</div>
<a href="#" id="back-to-top" title="Back to top">&uarr;</a>
<script type="text/javascript">
(function(){
  // Back to top handler
  var back = document.getElementById('back-to-top');
  if (back) {
    var scrollTrigger = 100;
    var backToTop = function(){
      var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      if (scrollTop > scrollTrigger) back.classList.add('show'); else back.classList.remove('show');
    };
    backToTop();
    window.addEventListener('scroll', backToTop);
    back.addEventListener('click', function(e){ e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); });
  }

  // helper for single vs double click
  function singleDoubleClick(el, single, dbl, timeout){ timeout = timeout || 300; var clicks=0, timer=null; el.addEventListener('click', function(evt){ clicks++; if (clicks===1){ timer=setTimeout(function(){ if(clicks===1) single.call(el,evt); else dbl.call(el,evt); clicks=0; }, timeout); } }); }

  // load initial log content and wire tabs
  fetch('cgi-bin/action.cgi?cmd=showlog').then(function(r){ return r.text(); }).then(function(log){ var tab1=document.getElementById('tab1'); if(tab1) tab1.innerHTML=log;

    var tabs = document.querySelectorAll('#tabs li'); tabs.forEach(function(li){
      singleDoubleClick(li, function(){
        var tab = li.getAttribute('data-tab'); var str = 'logname=' + tab;
        fetch('cgi-bin/action.cgi?cmd=showlog', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: str}).then(function(r){ return r.text(); }).then(function(log){ document.querySelectorAll('#tab-content p').forEach(function(p){ p.innerHTML = log; }); });
        document.querySelectorAll('#tabs li').forEach(function(x){ x.classList.remove('is-active'); });
        li.classList.add('is-active');
        document.querySelectorAll('#tab-content p').forEach(function(p){ p.classList.remove('is-active'); });
        var target = document.querySelector('p[data-content="'+tab+'"]'); if(target) target.classList.add('is-active');
      }, function(){
        var tab = li.getAttribute('data-tab'); var str = 'logname=' + tab;
        fetch('cgi-bin/action.cgi?cmd=clearlog', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: str}).then(function(r){ return r.text(); }).then(function(log){ document.querySelectorAll('#tab-content p').forEach(function(p){ p.innerHTML = log; }); });
        document.querySelectorAll('#tabs li').forEach(function(x){ x.classList.remove('is-active'); });
        li.classList.add('is-active');
        document.querySelectorAll('#tab-content p').forEach(function(p){ p.classList.remove('is-active'); });
        var target = document.querySelector('p[data-content="'+tab+'"]'); if(target) target.classList.add('is-active');
      });
    });
  });
})();
</script>
