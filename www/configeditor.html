<style id="configeditor_css">
.configeditor-wrap {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.configeditor-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
}
.configeditor-toolbar .select select {
  min-width: 200px;
}
#configeditor_area {
  font-family: monospace;
  font-size: 0.85em;
  width: 100%;
  min-height: 320px;
  resize: vertical;
  white-space: pre;
  overflow-wrap: normal;
  overflow-x: auto;
}
.configeditor-status { font-size: 0.9em; min-height: 1.4em; }
.configeditor-status.ok  { color: var(--v2-ok, #16a34a); }
.configeditor-status.err { color: var(--v2-tally, #dc3b3b); }
.configeditor-note { font-size: 0.82em; color: var(--v2-muted, #6b7280); margin-top: 0.25rem; }
</style>

<header class="page-head"><h1 class="page-title">Config editor</h1></header>
<div class="card status_card">
  <header class="card-header">
    <p class="card-header-title">
      <span class="title-with-icon">
        <svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4M5 8v-3a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-3M5 18H3M7 15l-2 3l2 3"/></svg>
        <span>Config File Editor</span>
      </span>
    </p>
  </header>
  <div class="card-content">
    <div class="configeditor-wrap">
      <div class="configeditor-toolbar">
        <div class="select">
          <select id="configeditor_file" aria-label="Configuration file">
            <option value="boot.conf">boot.conf</option>
            <option value="mqtt.conf">mqtt.conf</option>
            <option value="rtspserver.conf">rtspserver.conf</option>
            <option value="recording.conf">recording.conf</option>
            <option value="onvif.conf">onvif.conf</option>
            <option value="hostname.conf">hostname.conf</option>
            <option value="ntp_srv.conf">ntp_srv.conf</option>
            <option value="timezone.conf">timezone.conf</option>
            <option value="telegram.conf">telegram.conf</option>
            <option value="netmon.conf">netmon.conf</option>
            <option value="dns.conf">dns.conf</option>
            <option value="motion.conf">motion.conf</option>
            <option value="pttvolume.conf">pttvolume.conf</option>
          </select>
        </div>
        <button class="button is-small" type="button" id="configeditor_reload">Reload</button>
        <button class="button is-primary is-small" id="configeditor_save" type="button" disabled>Save</button>
      </div>

      <textarea id="configeditor_area" class="textarea" aria-label="File content" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Loading..."></textarea>

      <p id="configeditor_status" class="configeditor-status" role="status"></p>
      <p class="configeditor-note">
        Changes take effect after the relevant service is restarted. A timestamped backup is kept in <code>/tmp/</code> before each save. Boot-critical settings (lighttpd, network) are not editable here.
      </p>
    </div>
  </div>
</div>

<script>
(function () {
  // This inline script runs again every time the Config Editor page is injected
  // into #content. The dirty flag lives on window; the beforeunload listener is
  // registered once and only warns while the editor is still on screen.
  window.__cfgEditorDirty = false;
  var lastFile = '';
  var loadSeq = 0;
  var T = function (s) { return window.tc100T ? window.tc100T(s) : s; };

  if (!window.__cfgEditorUnloadBound) {
    window.__cfgEditorUnloadBound = true;
    window.addEventListener('beforeunload', function (e) {
      if (window.__cfgEditorDirty && document.getElementById('configeditor_area')) {
        e.preventDefault();
        e.returnValue = 'You have unsaved changes in the Config Editor.';
      }
    });
  }

  var sel = document.getElementById('configeditor_file');
  var area = document.getElementById('configeditor_area');
  var saveBtn = document.getElementById('configeditor_save');
  var reloadBtn = document.getElementById('configeditor_reload');
  if (!sel || !area || !saveBtn) return;

  function setStatus(msg, isErr) {
    var el = document.getElementById('configeditor_status');
    if (!el) return;
    el.textContent = msg;
    el.className = 'configeditor-status' + (msg ? (isErr ? ' err' : ' ok') : '');
  }

  function withToken(fn) {
    var ready = typeof window.ensureCsrfToken === 'function'
      ? window.ensureCsrfToken().catch(function () { return ''; })
      : Promise.resolve(typeof window.getCsrfToken === 'function' ? (window.getCsrfToken() || '') : '');
    return ready.then(fn);
  }

  // configeditor.cgi escapes quotes, backslashes and newlines but not tabs or
  // other control characters, which are illegal inside a JSON string: escape
  // them before parsing so a file with a tab still opens.
  function parseCgiJson(t) {
    /* eslint-disable-next-line no-control-regex */
    return JSON.parse(t.replace(/[\u0000-\u001f]/g, function (c) {
      return c === '\n' ? c : '\\u' + ('000' + c.charCodeAt(0).toString(16)).slice(-4);
    }));
  }

  function load(force) {
    var file = sel.value;
    if (!file) return;
    if (!force && window.__cfgEditorDirty && !confirm(T('You have unsaved changes. Discard and load a different file?'))) {
      sel.value = lastFile || file; // keep showing the file that is being edited
      return;
    }
    var mySeq = ++loadSeq;
    area.value = '';
    area.disabled = true;
    saveBtn.disabled = true;
    setStatus('Loading...', false);
    window.__cfgEditorDirty = false;

    fetch('cgi-bin/configeditor.cgi?cmd=read&file=' + encodeURIComponent(file), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (t) {
        if (mySeq !== loadSeq) return;
        var d = parseCgiJson(t);
        if (!d.ok) { setStatus('Load failed: ' + (d.error || 'unknown'), true); return; }
        // d.content is already the file text: do not turn a literal "\n" of the file into a line break.
        area.value = String(d.content == null ? '' : d.content);
        area.disabled = false;
        saveBtn.disabled = false;
        lastFile = file;
        setStatus(d.source === 'dist' ? 'Showing .dist template (no active config found)' : '', false);
      })
      .catch(function (e) {
        if (mySeq !== loadSeq) return;
        setStatus('Load error: ' + e, true);
      });
  }

  function save() {
    var file = lastFile;
    if (!file || area.disabled) return;
    if (!confirm(T('Save this file? A wrong value can stop a service from starting.') + '\n' + file)) return;

    saveBtn.disabled = true;
    setStatus('Saving...', false);

    withToken(function (tok) {
      var headers = { 'Content-Type': 'text/plain; charset=utf-8' };
      if (tok) headers['X-CSRF-Token'] = tok;
      return fetch('cgi-bin/configeditor.cgi?cmd=save&file=' + encodeURIComponent(file), {
        method: 'POST',
        headers: headers,
        body: area.value,
        cache: 'no-store'
      });
    })
    .then(function (r) {
      return r.text().then(function (t) { return { ok: r.ok, status: r.status, text: t }; });
    })
    .then(function (o) {
      var d = null;
      try { d = parseCgiJson(o.text); } catch (e) { /* not JSON */ }
      if (!d) { setStatus(o.ok ? 'Unexpected response' : 'Save failed (HTTP ' + o.status + ')', true); return; }
      if (d.ok) window.__cfgEditorDirty = false;
      setStatus(d.ok ? (d.message === 'Unchanged' ? 'Unchanged' : 'Saved successfully.') : ('Save failed: ' + (d.error || 'unknown')), !d.ok);
    })
    .catch(function (e) { setStatus('Save error: ' + e, true); })
    .then(function () { saveBtn.disabled = false; });
  }

  area.addEventListener('input', function () { window.__cfgEditorDirty = true; });
  sel.addEventListener('change', function () { load(false); });
  if (reloadBtn) reloadBtn.addEventListener('click', function () { load(false); });
  saveBtn.addEventListener('click', save);

  load(true);
}());
</script>
