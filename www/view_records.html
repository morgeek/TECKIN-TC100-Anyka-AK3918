<style id="custom_css">
.records-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
}

.records-panel .button {
  width: 100%;
}

#dateselectdiv,
#recordselectdiv,
#dateselect,
#recordselect {
  width: 100%;
  margin-bottom: 0.75rem;
}

.records-video {
  border: 1px solid rgba(22, 62, 112, 0.16);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.9);
  padding: 0.75rem;
}

.records-video video {
  width: 100%;
  border-radius: 10px;
}

@media screen and (min-width: 960px) {
  .records-layout {
    grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
    align-items: start;
  }
}
</style>

<div class="records-layout">
  <div class="records-panel">
    <div class="card status_card">
      <header class="card-header"><p class="card-header-title">Video Records</p></header>
      <div class="card-content">
        <div id="dateselectdiv" class="select is-loading">
          <select id="dateselect" onchange="onDateChanged()"></select>
        </div>
        <div id="recordselectdiv" class="select is-loading">
          <select id="recordselect" onchange="onRecordChanged()"></select>
        </div>
        <input class="switch" id="autoplay" type="checkbox" onclick="autoPlayCheck(this)">
        <label for="autoplay">Autoplay</label>
      </div>
    </div>
    <div class="records-actions">
      <button id="dwbtn" class="button is-primary" type="button" disabled onclick="downloadRecord()">Download</button>
      <button id="rmbtn" class="button is-danger" type="button" disabled onclick="removeRecord()">Remove</button>
    </div>
  </div>

  <div class="records-video">
    <p id="videonote" class="help is-danger"></p>
    <video id="rpl" controls playsinline></video>
  </div>
</div>

<script src="scripts/view_records.bundle.min.js" type="text/javascript"></script>
