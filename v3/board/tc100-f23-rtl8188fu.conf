# Board profile: TECKIN TC100 with the SOI JX-F23 sensor (MIPI 2 lanes), the Realtek RTL8188FU Wi-Fi (USB) and an
# 8 MiB SPI NOR flash (XMC XM25QH64A). The only variant tested so far (the author's two cameras, vendor firmware
# V1.1.41, U-Boot 2013.10.0-AK_V3.0.05).
#
# v3/install/hwcheck.sh picks the profile whose identity matches the inventory (v3/install/inventory.sh); at each
# start 3.0 links the chosen one to /tmp/board.conf. The installer writes nothing to the flash of a camera that
# matches no profile. Plain KEY=value lines (read with sed, never sourced by the boot scripts).
BOARD_NAME=TECKIN TC100 (JX-F23, RTL8188FU)

# --- identity, compared with the inventory
# the sensor id the 3.0 kernel logs ("sensor id 0xf23"); on the stock firmware only the sensor module is visible
SENSOR_ID=0xf23
STOCK_SENSOR_MODULE=sensor_f22+f23+f28+f35+f37_mipi
# USB vendor:product of the Wi-Fi chip
WIFI_USB=0bda:f179
# SPI NOR: whole size in bytes, and the JEDEC id / part name the 6.6 kernel reports (either one must match when
# the kernel gives it; the stock kernel gives neither, its U-Boot md5 is checked instead: tc100-3/known-stock.txt)
FLASH_SIZE=8388608
FLASH_JEDEC=207017
FLASH_NAME=xm25qh64a

# --- hardware settings used by 3.0 (boot.conf may still override the IR-cut ones)
# sensor tuning: the vendor file copied from the camera at install (stock name pattern, name on the card)
ISP_STOCK_GLOB=isp_f23*mipi*.conf
ISP_CONF=isp_f23_mipi_2lane.conf
# IR-cut coil: GPIO 81 / 80 of the SoC = 593 / 592 on Linux 6.6, pulse length
IRCUT_DAY_GPIO=593
IRCUT_NIGHT_GPIO=592
IRCUT_PULSE_MS=150
# LED class names (/sys/class/leds)
LED_BLUE=blue_led
LED_RED=red_led
LED_IR=ir
# Wi-Fi driver of the 6.6 kernel (built in)
WIFI_DRIVER=rtl8xxxu
