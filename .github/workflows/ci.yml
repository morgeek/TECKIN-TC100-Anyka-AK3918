name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Shell syntax (busybox ash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install busybox
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - name: Parse every camera-side shell script with busybox ash
        run: |
          fail=0
          count=0
          for f in $(git ls-files); do
            head -n 1 "$f" 2>/dev/null | grep -qE '^#!.*(/sh|ash)' || continue
            count=$((count + 1))
            if ! out=$(busybox ash -n "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            fi
          done
          echo "Checked $count scripts"
          exit $fail

  host-tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install squashfs-tools (flash image tests)
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Python regressions
        run: python3 -m unittest discover -s tests -v
      - name: Frontend tests
        run: node --test tests/frontend.test.js tests/settings-save.test.js

  packages:
    name: Update packages (SD card .tar, flash code .bin)
    runs-on: ubuntu-latest
    needs: [shell-syntax, host-tests]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools zip
      - name: Build
        run: |
          sh src/release/build-sd.sh
          sh src/release/build-update.sh
          sh src/release/build-code-package.sh
          sh scripts/flash-code.sh check dist/tc100-code-$(head -n 1 VERSION).bin
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tc100-packages
          path: |
            dist/tc100-sd-*.zip
            dist/tc100-update-*.tar
            dist/tc100-code-*.bin
      - name: Attach to the release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tc100-sd-*.zip
            dist/tc100-update-*.tar
            dist/tc100-code-*.bin
