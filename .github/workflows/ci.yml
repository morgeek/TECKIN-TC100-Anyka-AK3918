name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Shell syntax (busybox ash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install busybox
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - name: Parse every camera-side shell script with busybox ash
        run: |
          fail=0
          count=0
          for f in $(git ls-files); do
            head -n 1 "$f" 2>/dev/null | grep -qE '^#!.*(/sh|ash)' || continue
            count=$((count + 1))
            if ! out=$(busybox ash -n "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            fi
          done
          echo "Checked $count scripts"
          exit $fail

  host-tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Busybox (the scripts run under busybox ash on the camera; the tests use it when present, else dash)
        run: sudo apt-get install -y -qq busybox-static
      - name: Python regressions
        run: |
          set -o pipefail
          # the failing tests also go to the run's annotations, which can be read without access to the logs
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/py.log || {
            grep -E '^(FAIL|ERROR): ' /tmp/py.log | sort -u | while read -r l; do echo "::error title=unittest::$l"; done
            awk '/^(FAIL|ERROR): /{n=12} n>0{print; n--}' /tmp/py.log | grep -E 'Error|assert|line [0-9]+' | head -20 |
              while read -r l; do echo "::error title=detail::$l"; done
            exit 1; }
      - name: Frontend tests
        run: node --test tests/frontend.test.js tests/settings-save.test.js tests/live-video.test.js tests/records-timeline.test.js
