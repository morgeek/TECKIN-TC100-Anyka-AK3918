name: Build Linux 6.6 LTS Kernel with CMA 16MB for TECKIN TC100

on:
  push:
    branches: [ main, v3-linux66, v3-on-main, upgrade-3.2 ]
    # a tag v3... also publishes the GitHub release (path filters do not apply to tags)
    tags: [ 'v3*' ]
    paths:
      - 'patches/kernel-6.6/**'
      - 'v3/**'
      - 'www/**'
      - 'scripts/**'
      - 'controlscripts/**'
      - 'config/**'
      - 'sounds/**'
      - 'src/tc100rtsp/**'
      - 'src/libakuio/**'
      - 'src/h265enc/**'
      - 'src/httpfront/**'
      - 'src/mqttd/**'
      - 'src/supervisord/**'
      - 'src/onvifd/**'
      - 'src/mdnsd/**'
      - 'src/ispflip/**'
      - 'src/rwconf/**'
      - 'src/sigcheck/**'
      - 'src/logfwd/**'
      - 'src/netacl/**'
      - 'src/musl.mk'
      - 'src/ssp-freestanding.h'
      - 'src/whep/**'
      - 'bin/**'
      - 'lib/**'
      - 'src/jpegenc/**'
      - 'VERSION'
      - '.github/ci-pins.sh'
      - 'src/webui/package-lock.json'
      - 'tests/ci-vendor-budget.sh'
      - '.github/workflows/build-kernel-linux66.yml'
  workflow_dispatch:
    inputs:
      venc_pool:
        description: 'Test kernel only: compiled default of ak39_venc.pool (e.g. 12M for the encoder smart mode, item 9 of the implementer list). Empty = the normal 9600K.'
        required: false
        default: ''
      test_hrtimers:
        description: 'Test kernel only (audit 2026-11-06 H4, item 13): CONFIG_HIGH_RES_TIMERS + CONFIG_NO_HZ_IDLE, to boot from the SD card (tc100test/c66.img) and soak before any flash. Not for release.'
        required: false
        type: boolean
        default: false
      harden:
        description: 'Stack protector and full RELRO in the free programs (src/musl.mk HARDEN, src/ssp-freestanding.h). Off = the build of before 2026-11-23, to compare CPU or rule out the canary.'
        required: false
        type: boolean
        default: true

jobs:
  base:
    name: Base root filesystem (Buildroot)
    uses: ./.github/workflows/build-base-rootfs.yml

  build-kernel:
    name: Compile Linux 6.6 + Anyka AK3918 + CMA 16MB
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # the publish step reads the CI run of the commit (audit D4)
    env:
      # [harden] one switch for the free programs: make reads it (src/musl.mk), the freestanding builds below use FSSP
      HARDEN: ${{ github.event.inputs.harden == 'false' && '0' || '1' }}
      # reproducible builds (item CI-PIN): file times, the kernel build stamp and the uImage header come from the commit
      # time, so two runs of one commit give the same files; SOURCE_DATE_EPOCH itself is set by the next step
      TZ: UTC
      KBUILD_BUILD_USER: tc100
      KBUILD_BUILD_HOST: ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build time of this commit (SOURCE_DATE_EPOCH)
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$(git log -1 --format=%ct)" '+%a %b %e %H:%M:%S UTC %Y')" >> "$GITHUB_ENV"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev u-boot-tools gcc-arm-linux-gnueabi flex bison device-tree-compiler squashfs-tools zip

      - name: Clone Linux 6.6 Stable Tree (Tag v6.6)
        run: |
          # pinned: the tag must be this commit (.github/ci-pins.sh)
          . .github/ci-pins.sh
          git_clone_pinned "$LINUX_TAG" "$LINUX_COMMIT" linux-src $LINUX_URLS

      - name: Apply Anyka AK3918 Hardware, CMA 16MB & ALSA Audio Patches
        run: |
          cd linux-src
          echo "[+] Applying the Anyka AK3918 patch series (per subsystem)..."
          git config user.email ci@example.invalid && git config user.name ci
          git am --whitespace=nowarn ../patches/kernel-6.6/series/*.patch
          # a test kernel with another encoder pool (manual run with venc_pool): the pool is a boot-time allocation and
          # the command line comes from the bootloader, which is never changed, so the default itself is compiled in
          VP="${{ github.event.inputs.venc_pool }}"
          if [ -n "$VP" ]; then
            case "$VP" in [0-9]*[KM]) ;; *) echo "venc_pool must look like 9600K or 12M"; exit 1 ;; esac
            n=${VP%[KM]}; case "$VP" in *M) n=$((n * 1024)) ;; esac
            [ "$n" -ge 4096 ] && [ "$n" -le 12288 ] || { echo "venc_pool must be between 4M and 12M (the area is 12 MiB)"; exit 1; }
            grep -q 'static char \*pool = "9600K";' drivers/misc/ak39_venc.c
            sed -i "s/static char \*pool = \"9600K\";/static char *pool = \"$VP\";/" drivers/misc/ak39_venc.c
            grep -n 'static char \*pool' drivers/misc/ak39_venc.c
            echo "### Test kernel: ak39_venc.pool default $VP (not for release)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Kernel with CMA and ALSA
        run: |
          cd linux-src
          # RTL8188FU firmware (embedded in the kernel): from linux-firmware, pinned tag and checksum (.github/ci-pins.sh)
          mkdir -p firmware/rtlwifi
          . ../.github/ci-pins.sh
          fetch_sha256 "$RTL8188FU_FW_SHA256" firmware/rtlwifi/rtl8188fufw.bin $RTL8188FU_FW_URLS
          cp ../patches/kernel-6.6/defconfig_cma .config
          # H4 test kernel (manual run only): one-shot timer mode, so that usleep(100) sleeps 100 us and not a 10 ms tick
          # (pacing, ABR); the timer of patch 0001 declares CLOCK_EVT_FEAT_ONESHOT. Checks on the camera: /proc/timer_list
          # "resolution: 1 nsecs", then the 2 h H.265 soak (nq/) before the owner is asked for any flash write.
          if [ "${{ github.event.inputs.test_hrtimers }}" = "true" ]; then
            sed -i 's/^# CONFIG_HIGH_RES_TIMERS is not set$/CONFIG_HIGH_RES_TIMERS=y/; s/^CONFIG_HZ_PERIODIC=y$/# CONFIG_HZ_PERIODIC is not set/; s/^# CONFIG_NO_HZ_IDLE is not set$/CONFIG_NO_HZ_IDLE=y/' .config
            grep -E '^CONFIG_(HIGH_RES_TIMERS|NO_HZ_IDLE)=y' .config
            echo "### Test kernel: HIGH_RES_TIMERS + NO_HZ_IDLE (H4, not for release)" >> "$GITHUB_STEP_SUMMARY"
          fi
          # a test kernel must never pass for a release: the packages of this run carry "-testkernel" in their version
          if [ "${{ github.event.inputs.test_hrtimers }}" = "true" ] || [ -n "${{ github.event.inputs.venc_pool }}" ]; then
            printf '%s-testkernel\n' "$(head -n 1 ../VERSION)" > ../VERSION
            echo "### Packages of this run: version $(cat ../VERSION)" >> "$GITHUB_STEP_SUMMARY"
          fi
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- olddefconfig
          echo "[+] Validating CMA & Audio Configuration in .config:"
          grep -E "CONFIG_CMA|CONFIG_SOUND|CONFIG_SND_AK_PCM|CONFIG_CODEC_AK39|CONFIG_ZRAM|CONFIG_ZSMALLOC|CONFIG_BLK_DEV" .config

      - name: Compile zImage and Device Tree
        run: |
          set -eo pipefail
          cd linux-src
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- -j$(nproc) zImage dtbs 2>&1 | tee ../build.log

      - name: Show Build Errors on Failure
        if: failure()
        run: |
          tail -n 120 build.log || true

      - name: Append DTB & Generate uImage (oipc.img)
        run: |
          cd linux-src
          echo "[+] Locating compiled DTB files in arch/arm/boot/:"
          find arch/arm/boot/ -name "*.dtb" || true
          DTB_PATH=$(find arch/arm/boot/ -name "*tc100*.dtb" | head -n 1)
          if [ -z "$DTB_PATH" ] || [ ! -f "$DTB_PATH" ]; then
            echo "[!] Building DTB directly via dtc..."
            mkdir -p arch/arm/boot/dts/anyka
            dtc -I dts -O dtb -o arch/arm/boot/dts/anyka/ak3918ev300-tc100.dtb arch/arm/boot/dts/anyka/ak3918ev300-tc100.dts
            DTB_PATH="arch/arm/boot/dts/anyka/ak3918ev300-tc100.dtb"
          fi
          echo "[+] Selected DTB: $DTB_PATH"
          ls -lh "$DTB_PATH"
          cat arch/arm/boot/zImage "$DTB_PATH" > arch/arm/boot/zImage-dtb
          mkimage -A arm -O linux -T kernel -C none -a 0x80008000 -e 0x80008000 -n "Linux 6.6 True V3 CMA16+ALSA" -d arch/arm/boot/zImage-dtb oipc.img
          ls -lh oipc.img
          mkdir -p ../output
          cp oipc.img ../output/
          md5sum ../output/oipc.img > ../output/oipc.img.md5

      - name: Flash budget gate (kernel must fit the 2 MiB KERNEL region)
        run: |
          python3 scripts/flash_budget.py --kernel output/oipc.img
          # cameras installed by hand on 2026-10-24 load 0x1ce000 bytes of the kernel partition (U-Boot flashload)
          n=$(wc -c < output/oipc.img); [ "$n" -le 1892352 ] || echo "::warning::kernel is $n bytes: more than the 0x1ce000 that the first hand-made flashload reads" 

      - name: Get our base root filesystem
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tc100-base-rootfs
          path: base-rootfs

      - name: Build the test pack (initramfs, tc100_rtsp)
        run: |
          set -e
          P=output/tc100test
          mkdir -p $P
          cp output/oipc.img $P/
          test -f base-rootfs/rootfs.cpio.gz   # our Buildroot image; no fallback
          # sudo's env_reset drops SOURCE_DATE_EPOCH: passed explicitly (review of CI-PIN)
          sudo env SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-}" sh v3/build-rootfs66.sh base-rootfs/rootfs.cpio.gz $P/oipcrd66.gz
          # [harden] the freestanding programs carry their own canary (src/ssp-freestanding.h); HARDEN=0 leaves it out
          case "$HARDEN" in 0) FSSP=-fno-stack-protector ;; *) FSSP=-fstack-protector-strong ;; esac
          arm-linux-gnueabi-gcc -Os -Wall $FSSP -marm -march=armv5te -nostdlib -static -fno-builtin -fno-pic -no-pie -Wl,--build-id=none -s src/httpfront/httpfront.c -o $P/httpfront
          arm-linux-gnueabi-gcc -Os -Wall $FSSP -marm -march=armv5te -nostdlib -static -fno-builtin -fno-pic -no-pie -Wl,--build-id=none -s src/mdnsd/mdnsd.c -o $P/tc100-mdnsd
          # 2026-11-07: every program is built against musl 1.2.4, the camera's own libc (src/musl.mk): tc100-mqttd,
          # -supervisord, -onvifd, rwconf, tc100-logfwd, libnetacl-musl.so and, since 3.0.1-rc34, tc100_rtsp itself
          # (libakuio linked in, the free encoder src/h265enc/freeenc.h): no vendor library and no uClibc runtime
          sh v3/musl/build-musl.sh
          make -C src/tc100rtsp CROSS=arm-linux-gnueabi- musl >/dev/null
          cp src/tc100rtsp/tc100_rtsp-musl $P/tc100_rtsp
          arm-linux-gnueabi-readelf -l $P/tc100_rtsp | grep -q 'ld-musl-arm.so.1' || { echo "tc100_rtsp is not a musl program"; exit 1; }
          if arm-linux-gnueabi-readelf -d $P/tc100_rtsp | grep NEEDED | grep -v '\[libc.so\]'; then echo "tc100_rtsp needs more than libc.so"; exit 1; fi
          if [ "$HARDEN" != 0 ]; then
            arm-linux-gnueabi-readelf --dyn-syms -W $P/tc100_rtsp | grep -q ' __stack_chk_fail$' || { echo "tc100_rtsp has no stack protector (HARDEN)"; exit 1; }
            arm-linux-gnueabi-readelf -d $P/tc100_rtsp | grep -q 'BIND_NOW' || { echo "tc100_rtsp is not linked -z now (HARDEN)"; exit 1; }
            grep -q 'stack smashing detected' $P/httpfront || { echo "httpfront has no stack protector (HARDEN)"; exit 1; }
          fi
          make -C src/mqttd CROSS=arm-linux-gnueabi- >/dev/null
          cp src/mqttd/tc100-mqttd $P/
          make -C src/supervisord CROSS=arm-linux-gnueabi- >/dev/null
          cp src/supervisord/tc100-supervisord $P/
          make -C src/onvifd CROSS=arm-linux-gnueabi- >/dev/null
          cp src/onvifd/tc100-onvifd $P/
          # rc27 R3 (a libc variable crashed tc100-onvifd): the check is for the stand-in libc builds, of which only
          # libnetacl.so is left (the release step); the musl programs link against the real libc
          # [t1-qp] the T1 bench of the encoder's QP control buffer (test pack only, docs/linux-port/frontier/t1-qp-bench.md)
          make -C src/h265enc CROSS=arm-linux-gnueabi- qpbench >/dev/null
          cp src/h265enc/qpbench $P/
          cp v3/S39tc100-linux66 v3/autorun-linux66.sh $P/
          (cd $P && md5sum * > md5sums.txt)

      - name: Build the 3.0 release (free user space image, SD package, web update)
        run: |
          set -e
          arm-linux-gnueabi-gcc -Os -Wall -static -march=armv5te -mfloat-abi=soft -o output/envtool v3/install/envtool.c
          # isp_flip ships from its source, not the copy kept in bin/ (audit D3); freestanding like httpfront
          case "$HARDEN" in 0) FSSP=-fno-stack-protector ;; *) FSSP=-fstack-protector-strong ;; esac
          arm-linux-gnueabi-gcc -Os -Wall $FSSP -marm -march=armv5te -nostdlib -static -fno-builtin -fno-pic -no-pie -Wl,--build-id=none -s src/ispflip/isp_flip.c -o bin/isp_flip
          # rwconf (item 53) and tc100-logfwd ship from their source: musl programs like tc100-mqttd (src/musl.mk)
          sh v3/musl/build-musl.sh
          make -C src/rwconf CROSS=arm-linux-gnueabi- >/dev/null
          cp src/rwconf/rwconf bin/rwconf
          # tc100-sigcheck: Ed25519 verifier of the update packages (Monocypher; docs/linux-port/upgrade-3.2/sign.md)
          make -C src/sigcheck CROSS=arm-linux-gnueabi- >/dev/null
          cp src/sigcheck/tc100-sigcheck bin/tc100-sigcheck
          make -C src/logfwd CROSS=arm-linux-gnueabi- >/dev/null
          cp src/logfwd/tc100-logfwd bin/tc100-logfwd
          # libnetacl-musl: the accept/bind filter for the base system's musl busybox telnetd/ftpd
          make -C src/netacl CROSS=arm-linux-gnueabi- musl >/dev/null
          cp src/netacl/libnetacl-musl.so lib/libnetacl-musl.so
          gcc -O2 -Wall -o /tmp/envtool-host v3/install/envtool.c
          # audit 2026-11-06 S5: the web JavaScript and inline scripts/styles of the image are minified (esbuild, pinned)
          # src/webui/package-lock.json pins esbuild 0.25.12 and the integrity hash of every package (npm ci checks it)
          npm ci --prefix src/webui --no-audit --no-fund >/dev/null
          MINIFY_WWW=1 READELF=arm-linux-gnueabi-readelf sh v3/build-stack.sh output/tc100test base-rootfs/rootfs.cpio.gz output/stack
          sh v3/build-release.sh output/stack output/oipc.img output/tc100test/oipcrd66.gz output/envtool output/release

      - name: Flash budget gate (stack, initramfs, vendor partition)
        run: |
          python3 scripts/flash_budget.py --kernel output/oipc.img --initrd output/tc100test/oipcrd66.gz --stack output/stack/stack.sqfs
          # the vendor image is made on each camera: a worst-case stand-in must fit its partition (tests/ci-vendor-budget.sh)
          sh tests/ci-vendor-budget.sh

      - name: Upload the 3.0 release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tc100-3-release${{ github.event.inputs.venc_pool && format('-TESTKERNEL-pool{0}', github.event.inputs.venc_pool) || '' }}
          path: |
            output/release/*.zip
            output/release/*.tar

      - name: Publish the GitHub release (tags v3*)
        if: startsWith(github.ref, 'refs/tags/v3')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # the tag must name the version the files carry (a v3.0.1 tag on a 3.0.1-rc24 tree would publish rc files
          # as the release)
          V=$(head -n 1 "$GITHUB_WORKSPACE/VERSION" | tr -d '\r')
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION $V"; exit 1; }
          # audit D4: only a commit whose CI (ci.yml, run by the push to main) passed is published; wait for it, up
          # to 30 minutes
          r=
          for i in $(seq 1 60); do
            r=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
                --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            case "$r" in "completed success") break ;; completed*) echo "CI of $GITHUB_SHA: $r"; exit 1 ;; esac
            sleep 30
          done
          [ "$r" = "completed success" ] || { echo "no passed CI run for $GITHUB_SHA (last seen: $r)"; exit 1; }
          cd output/release
          md5sum *.zip *.tar > MD5SUMS.txt
          PRE=; case "$GITHUB_REF_NAME" in *-rc*|*-beta*|*-alpha*) PRE=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $PRE             --title "TC100 firmware $GITHUB_REF_NAME" --notes-file "$GITHUB_WORKSPACE/v3/install/RELEASE-NOTES.md"             *.zip *.tar MD5SUMS.txt

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tc100-linux66-cma16-kernel${{ github.event.inputs.venc_pool && format('-pool{0}', github.event.inputs.venc_pool) || '' }}
          path: output/

      - name: Pack kernel symbols (to decode Oops traces)
        run: |
          mkdir -p symbols
          cp linux-src/System.map linux-src/.config symbols/
          # unstripped user-space programs (the shipped ones are stripped)
          cp src/tc100rtsp/tc100_rtsp-musl.dbg src/mqttd/tc100-mqttd.dbg src/onvifd/tc100-onvifd.dbg src/supervisord/tc100-supervisord.dbg symbols/ 2>/dev/null || true
          gzip -n -c linux-src/vmlinux > symbols/vmlinux.gz

      - name: Upload kernel symbols
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tc100-linux66-symbols
          path: symbols/
