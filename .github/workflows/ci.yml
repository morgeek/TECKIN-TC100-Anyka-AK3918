name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt bats

      - name: Run shellcheck
        run: shellcheck -x **/*.sh

      - name: Run shfmt (check)
        run: shfmt -d -i 2 -ci . || true

      - name: Run tests (bats)
        run: |
          bats tests
